<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掷骰子</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 30%, #2a3550 0%, #141a2b 60%, #0a0e18 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #ui {
    position: fixed; left: 0; right: 0; bottom: 36px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    pointer-events: none; z-index: 10;
  }
  #result {
    color: #fff; font-size: 22px; font-weight: 600; letter-spacing: 2px;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .4s ease; min-height: 28px;
  }
  #result.show { opacity: 1; }
  #roll {
    pointer-events: auto;
    padding: 13px 42px; font-size: 17px; font-weight: 600; letter-spacing: 4px;
    color: #2a2030; border: none; border-radius: 30px; cursor: pointer;
    background: linear-gradient(135deg, #ffe8a3, #f6c14e);
    box-shadow: 0 8px 24px rgba(246,193,78,.35), inset 0 1px 0 rgba(255,255,255,.6);
    transition: transform .12s ease, box-shadow .2s ease;
  }
  #roll:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(246,193,78,.45), inset 0 1px 0 rgba(255,255,255,.6); }
  #roll:active { transform: translateY(1px); }
  #roll:disabled { opacity: .5; cursor: default; transform: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="result"></div>
  <button id="roll">掷 骰 子</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as CANNON from 'cannon-es';

const BOWL_R = 4.2;
const BOWL_H = 2.4;
const DIE    = 1.0;

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(7.5, 8.5, 7.5);
camera.lookAt(0, -0.4, 0);

scene.add(new THREE.HemisphereLight(0xbcd0ff, 0x202838, 0.55));

const key = new THREE.DirectionalLight(0xfff2d8, 2.2);
key.position.set(6, 12, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 8;   key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9ab4ff, 0.5);
fill.position.set(-6, 4, -4);
scene.add(fill);

const rim = new THREE.PointLight(0xffd9a0, 0.8, 30);
rim.position.set(0, 6, -6);
scene.add(rim);

const floorMat = new THREE.MeshStandardMaterial({ color: 0x1b2236, roughness: 0.9, metalness: 0.1 });
const floor = new THREE.Mesh(new THREE.CircleGeometry(16, 64), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -BOWL_H - 0.02;
floor.receiveShadow = true;
scene.add(floor);

function makeBowlProfile(segments) {
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * (Math.PI / 2);
    const x = Math.sin(a) * BOWL_R;
    const y = -Math.cos(a) * BOWL_H;
    pts.push(new THREE.Vector2(x, y));
  }
  return pts;
}
const profile = makeBowlProfile(48);

const bowlGeo = new THREE.LatheGeometry(profile, 96);
bowlGeo.computeVertexNormals();
const bowlMat = new THREE.MeshPhysicalMaterial({
  color: 0xf4f7fb, roughness: 0.25, metalness: 0.0,
  clearcoat: 0.6, clearcoatRoughness: 0.3,
  side: THREE.DoubleSide,
});
const bowl = new THREE.Mesh(bowlGeo, bowlMat);
bowl.receiveShadow = true;
bowl.castShadow = true;
scene.add(bowl);

const ringGeo = new THREE.TorusGeometry(BOWL_R, 0.09, 16, 120);
const ringMat = new THREE.MeshStandardMaterial({ color: 0xd9c089, roughness: 0.35, metalness: 0.8 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2;
ring.castShadow = true;
scene.add(ring);

function makePipTexture(n) {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, s, s);
  g.addColorStop(0, '#fffdf6'); g.addColorStop(1, '#efe7d2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  const r = s * 0.085;
  const positions = {
    1: [[.5,.5]],
    2: [[.27,.27],[.73,.73]],
    3: [[.25,.25],[.5,.5],[.75,.75]],
    4: [[.27,.27],[.73,.27],[.27,.73],[.73,.73]],
    5: [[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]],
    6: [[.28,.25],[.72,.25],[.28,.5],[.72,.5],[.28,.75],[.72,.75]],
  };
  for (const [px, py] of positions[n]) {
    const x = px * s, y = py * s;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = (n === 1) ? '#d23b3b' : '#2a2a30';
    ctx.fill();
    ctx.beginPath(); ctx.arc(x - r*0.25, y - r*0.25, r*0.55, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  return tex;
}

// 面顺序 +X,-X,+Y,-Y,+Z,-Z ；对面和为 7
const faceNums = [1, 6, 2, 5, 3, 4];
const dieMats = faceNums.map(n => new THREE.MeshStandardMaterial({
  map: makePipTexture(n), roughness: 0.45, metalness: 0.05,
}));
const dieGeo = new RoundedBoxGeometry(DIE, DIE, DIE, 6, 0.14);
const die = new THREE.Mesh(dieGeo, dieMats);
die.castShadow = true;
die.receiveShadow = true;
scene.add(die);

const faceNormals = [
  { n: new THREE.Vector3( 1, 0, 0), v: 1 },
  { n: new THREE.Vector3(-1, 0, 0), v: 6 },
  { n: new THREE.Vector3( 0, 1, 0), v: 2 },
  { n: new THREE.Vector3( 0,-1, 0), v: 5 },
  { n: new THREE.Vector3( 0, 0, 1), v: 3 },
  { n: new THREE.Vector3( 0, 0,-1), v: 4 },
];

const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -22, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;

const matDie  = new CANNON.Material('die');
const matBowl = new CANNON.Material('bowl');
world.addContactMaterial(new CANNON.ContactMaterial(matDie, matBowl, {
  friction: 0.18, restitution: 0.45,
}));

function buildBowlTrimesh() {
  const radial = 36, rings = 24;
  const verts = [];
  const idx = [];
  for (let r = 0; r <= rings; r++) {
    const a = (r / rings) * (Math.PI / 2);
    const rad = Math.sin(a) * BOWL_R;
    const y = -Math.cos(a) * BOWL_H;
    for (let s = 0; s <= radial; s++) {
      const t = (s / radial) * Math.PI * 2;
      verts.push(Math.cos(t) * rad, y, Math.sin(t) * rad);
    }
  }
  const row = radial + 1;
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < radial; s++) {
      const a = r * row + s;
      const b = a + 1;
      const c = a + row;
      const d = c + 1;
      idx.push(a, c, b);
      idx.push(b, c, d);
    }
  }
  return new CANNON.Trimesh(verts, idx);
}
const bowlBody = new CANNON.Body({ mass: 0, material: matBowl });
bowlBody.addShape(buildBowlTrimesh());
world.addBody(bowlBody);

const half = DIE / 2;
const dieBody = new CANNON.Body({
  mass: 1,
  material: matDie,
  shape: new CANNON.Box(new CANNON.Vec3(half, half, half)),
  linearDamping: 0.25,
  angularDamping: 0.28,
});
dieBody.allowSleep = true;
dieBody.sleepSpeedLimit = 0.18;
dieBody.sleepTimeLimit = 0.4;
world.addBody(dieBody);

const resultEl = document.getElementById('result');
const rollBtn  = document.getElementById('roll');
let rolling = false;
let settleTimer = 0;

function roll() {
  if (rolling) return;
  rolling = true;
  settleTimer = 0;
  resultEl.classList.remove('show');
  rollBtn.disabled = true;

  const ang = Math.random() * Math.PI * 2;
  const rr = BOWL_R * 0.45;
  dieBody.wakeUp();
  dieBody.position.set(Math.cos(ang) * rr, BOWL_H * 0.4 + 2.2, Math.sin(ang) * rr);
  dieBody.quaternion.setFromEuler(Math.random()*6, Math.random()*6, Math.random()*6);

  const inward = new CANNON.Vec3(-Math.cos(ang), 0, -Math.sin(ang));
  const tangent = new CANNON.Vec3(-Math.sin(ang), 0, Math.cos(ang));
  const sp = 3 + Math.random()*2;
  dieBody.velocity.set(
    inward.x*sp*0.4 + tangent.x*sp,
    -2,
    inward.z*sp*0.4 + tangent.z*sp
  );
  const R = () => (Math.random() - 0.5);
  dieBody.angularVelocity.set(R()*26, R()*26, R()*26);
}

function readTopFace() {
  const q = die.quaternion;
  let best = -Infinity, val = 1;
  const tmp = new THREE.Vector3();
  for (const f of faceNormals) {
    tmp.copy(f.n).applyQuaternion(q);
    if (tmp.y > best) { best = tmp.y; val = f.v; }
  }
  return val;
}

function finish() {
  rolling = false;
  rollBtn.disabled = false;
  const v = readTopFace();
  resultEl.textContent = `🎲  ${v} 点`;
  resultEl.classList.add('show');
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1/30);
  world.step(1/60, dt, 3);

  die.position.copy(dieBody.position);
  die.quaternion.copy(dieBody.quaternion);

  if (rolling) {
    const v = dieBody.velocity.length() + dieBody.angularVelocity.length();
    if (v < 0.35) {
      settleTimer += dt;
      if (settleTimer > 0.5) finish();
    } else {
      settleTimer = 0;
    }
  }
  renderer.render(scene, camera);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

rollBtn.addEventListener('click', roll);

dieBody.position.set(0, -BOWL_H + half + 0.05, 0);
animate();
setTimeout(roll, 500);
</script>
</body>
</html>
